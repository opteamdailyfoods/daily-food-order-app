<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Food Products - Order App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #2b0a0d;
            --primary-light: #421217;
            --accent-yellow: #ffdc00;
            --accent-green: #4caf50;
            --success-color: #2e7d32;
            --danger-color: #ef4444;
            --bg-secondary: #fdfbf7;
            --bg-tertiary: #f3efe6;
            --text-primary: #212121;
            --text-secondary: #616161;
            --border-color: #e0dace;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2b0a0d 0%, #421217 100%);
            min-height: 100vh;
            padding: 1rem;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid var(--accent-yellow);
        }
        .header h1 { font-size: 32px; color: var(--accent-yellow); margin-bottom: 0.25rem; }
        .header-logo-img {
            max-width: 130px;
            height: auto;
            border-radius: 50%;
            margin-bottom: 0.75rem;
            background: #ffffff;
            padding: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            object-fit: contain;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .form-section, .order-section {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .order-section { max-height: 800px; overflow-y: auto; }
        .form-section h2, .order-section h2 { margin-bottom: 1.5rem; color: var(--primary-color); font-size: 20px; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-primary); font-size: 14px; }
        .required::after { content: " *"; color: var(--danger-color); }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-secondary);
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            background: white;
        }
        .autocomplete-container { position: relative; }
        .autocomplete-list {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: white;
            border: 2px solid var(--primary-color);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .autocomplete-list.show { display: block; }
        .autocomplete-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--bg-secondary);
        }
        .autocomplete-item:hover { background: var(--bg-secondary); }
        .autocomplete-item-code { font-weight: 700; color: var(--primary-color); font-size: 13px; }
        .autocomplete-item-name { color: var(--text-primary); font-size: 13px; font-weight: 500; }
        button {
            width: 100%; padding: 0.85rem; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .btn-add { background: var(--accent-green); color: white; margin-top: 1rem; }
        .btn-add:hover { background: var(--success-color); }
        .order-items { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .order-item {
            background: var(--bg-secondary); padding: 1rem; border-radius: 8px;
            border-left: 5px solid var(--accent-yellow);
        }
        .order-item-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .order-item-code { font-weight: 700; color: var(--primary-color); font-size: 14px; }
        .order-item-name { color: var(--text-primary); font-weight: 500; font-size: 13px; }
        .order-item-remove {
            background: var(--danger-color); color: white; border: none;
            padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 12px; width: auto;
        }
        .order-footer { padding-top: 1.5rem; border-top: 2px solid var(--border-color); margin-top: 1.5rem; }
        .order-grand-total {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            color: var(--accent-yellow); padding: 1rem; border-radius: 8px; margin-bottom: 1rem;
        }
        .action-buttons { display: flex; gap: 0.5rem; flex-direction: column; }
        .btn-primary { background: var(--accent-green); color: white; }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 2px solid var(--border-color); }
        .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-secondary); }
        .badge { background: var(--primary-color); color: var(--accent-yellow); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 11px; }
        @media (max-width: 1024px) { .main-content { grid-template-columns: 1fr; } }
    </style>
</head>

                    </div>
                </div>

                <div class="form-group">
                    <label class="required">Quantity</label>
                    <input type="number" id="quantity" value="1" min="1">
                </div>

                <button class="btn-add" id="btnAddProduct">➕ Add Product</button>
            </div>

            <div class="order-section">
                <h2>📋 Order Summary <span class="badge" id="itemCount">0</span></h2>
                <div id="orderItems" class="order-items">
                    <div class="empty-state">
                        <p>No products added yet</p>
                    </div>
                </div>

                <div class="order-footer" id="footerSection" style="display: none;">
                    <div class="order-grand-total">

                    </div>
                    <div class="action-buttons">

                        <button class="btn-secondary" id="btnClear" style="color: var(--danger-color); border-color: var(--danger-color);">🗑️ Clear Order</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

                    return;
                }

                const filtered = productsData.filter(p =>
                    p.name.toLowerCase().includes(search) || p.code.toLowerCase().includes(search)
                ).slice(0, 10);

                if (filtered.length > 0) {
                    autocompleteList.innerHTML = filtered.map(p => `
                        <div class="autocomplete-item" data-code="${p.code}">
                            <div class="autocomplete-item-code">${p.code}</div>
                            <div class="autocomplete-item-name">${p.name}</div>
                        </div>
                    `).join('');
                    autocompleteList.classList.add('show');
                } else {
                    autocompleteList.classList.remove('show');
                }
            });

            autocompleteList.addEventListener('click', (e) => {
                const item = e.target.closest('.autocomplete-item');
                if (item) {
                    const code = item.getAttribute('data-code');
                    selectedProduct = productsData.find(p => p.code === code);
                    if (selectedProduct) {
                        productSearch.value = `${selectedProduct.code} - ${selectedProduct.name}`;
                    }
                    autocompleteList.classList.remove('show');
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.autocomplete-container')) {
                    autocompleteList.classList.remove('show');
                }
            });

            document.getElementById('btnAddProduct').addEventListener('click', addProductToOrder);
            document.getElementById('btnWhatsapp').addEventListener('click', sendToWhatsApp);
            document.getElementById('btnCopy').addEventListener('click', copyToClipboard);
            document.getElementById('btnClear').addEventListener('click', clearOrder);
        });

        function addProductToOrder() {
            const salesAgent = document.getElementById('salesAgent').value.trim();
            const storeName = document.getElementById('storeName').value.trim();
            const searchText = document.getElementById('productSearch').value.trim();
            const quantity = parseInt(document.getElementById('quantity').value) || 1;

            if (!salesAgent || !storeName) {
                alert('Please enter Sales Agent and Store Name.');
                return;
            }

            let product = selectedProduct;
            if (!product && searchText) {
                product = productsData.find(p => 
                    searchText.toLowerCase().includes(p.code.toLowerCase()) || 
                    p.name.toLowerCase().includes(searchText.toLowerCase())
                );
            }

            if (!product) {
                alert('Product not found. Please select an option from the dropdown.');
                return;
            }

            const existing = orderList.find(item => item.code === product.code);
            if (existing) {
                existing.quantity += quantity;
            } else {
                orderList.push({ ...product, quantity });
            }

            document.getElementById('productSearch').value = '';
            document.getElementById('quantity').value = 1;
            selectedProduct = null;
            updateOrderDisplay();
        }

        function updateOrderDisplay() {
            const orderItemsContainer = document.getElementById('orderItems');
            const itemCount = document.getElementById('itemCount');
            const totalItems = document.getElementById('totalItems');
            const footerSection = document.getElementById('footerSection');

            itemCount.textContent = orderList.length;

            if (orderList.length === 0) {
                orderItemsContainer.innerHTML = '<div class="empty-state"><p>No products added yet</p></div>';
                footerSection.style.display = 'none';
                return;
            }

            let totalQty = 0;
            orderItemsContainer.innerHTML = orderList.map((item, index) => {
                totalQty += item.quantity;
                return `
                    <div class="order-item">
                        <div class="order-item-header">
                            <div>
                                <div class="order-item-code">${item.code}</div>
                                <div class="order-item-name">${item.name}</div>
                            </div>
                            <button class="order-item-remove" onclick="removeProduct(${index})">Remove</button>
                        </div>
                        <div style="margin-top: 0.5rem; font-size: 13px;">Qty: ${item.quantity}</div>
                    </div>
                `;
            }).join('');

            totalItems.textContent = totalQty;
            footerSection.style.display = 'block';
        }

        function removeProduct(index) {
            orderList.splice(index, 1);
            updateOrderDisplay();
        }

        function clearOrder() {
            if (confirm('Clear all products?')) {
                orderList = [];
                updateOrderDisplay();
            }
        }

        function sendToWhatsApp() {
            const salesAgent = document.getElementById('salesAgent').value.trim();
            const storeName = document.getElementById('storeName').value.trim();
            if (!salesAgent || !storeName || orderList.length === 0) return;

            let text = `📦 *NEW ORDER - DAILY FOOD PRODUCTS*\n\n`;
            text += `👤 Agent: ${salesAgent}\n🏪 Store: ${storeName}\n\n`;
            orderList.forEach((item, idx) => {
                text += `${idx + 1}. *${item.code}* - ${item.name} (Qty: ${item.quantity})\n`;
            });
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }

        function copyToClipboard() {
            const salesAgent = document.getElementById('salesAgent').value.trim();
            const storeName = document.getElementById('storeName').value.trim();
            if (!salesAgent || !storeName || orderList.length === 0) return;

            let text = `NEW ORDER - DAILY FOOD PRODUCTS\nAgent: ${salesAgent}\nStore: ${storeName}\n\n`;
            orderList.forEach((item, idx) => {
                text += `${idx + 1}. ${item.code} - ${item.name} (Qty: ${item.quantity})\n`;
            });
            navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
        }
    </script>
</body>
</html>
